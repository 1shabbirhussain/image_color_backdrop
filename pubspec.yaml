name: image_color_backdrop
description: Extracts the dominant, vibrant or muted color from an image, icon or logo and turns it into a background color with opacity, tint, contrast and gradient controls.
version: 0.1.0
repository: https://github.com/1shabbirhussain/image_color_backdrop
issue_tracker: https://github.com/1shabbirhussain/image_color_backdrop/issues

topics:
  - color
  - image
  - palette
  - background
  - widget

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

screenshots:
  - description: Overview of styles, gradients, the live playground and whole-page tinting.
    path: screenshots/overview.png
  - description: The same logos as solid, soft, pastel and deep backdrops.
    path: screenshots/gallery_styles.png
  - description: Vibrant strategy, edge sampling, tonal and palette gradients.
    path: screenshots/gallery_gradients.png
  - description: Live playground with strategy, gradient, opacity, brightness and saturation controls.
    path: screenshots/playground.png
  - description: A whole page and a custom card tinted by the tapped image.
    path: screenshots/use_the_color.png

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
